version: 2.1

executors:
  docker-publisher:
    environment:
      IMAGE_NAME: docker.io/kisan07/kishh
    docker:
      - image: circleci/node:latest
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD

jobs:
  publishLatestToHub:
    executor: docker-publisher

    steps:
      - checkout

      - setup_remote_docker

      - run:
          name: Publish Docker Image to Docker Hub
          command: |
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            docker build -t $IMAGE_NAME:latest .

            docker push $IMAGE_NAME:latest

            curl -X POST \
              -u "KISAN:$JENKINS_API_TOKEN" \
              "http://8.234.73.125:8080/job/Kisan/build"

workflows:
  version: 2

  build-master:
    jobs:
      - publishLatestToHub